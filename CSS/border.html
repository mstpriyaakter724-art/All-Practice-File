<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Border</title>
    <style>
        .btn {
           border: none; 
           padding: 10px 15px;
           font: 20px;
           background-color: rgb(70, 92, 94);
           color: #eb36ae;
           border-radius: 5px 10px 5px;
           cursor: pointer;
        }
        .btn:hover{
            background-color: aqua;
        }
        .div1 {
            margin: 20px;
            border: 10px inset rgb(224, 76, 145);
            padding: 15px;
        }
        .div2 {
            padding: 10px;
            border-top: 2px dotted rgb(10, 25, 241);
            border-bottom: 3px double rgb(30, 218, 30);
            border-left: 5px solid  crimson;
            border-right: 2px dashed hotpink;
            margin: 50px;
        }

    </style>
</head>
<body>
    <button class="btn">Click</button>
    <div class="div1">Lorem ipsum dolor sit amet consectetur adipisicing elit. Sint aperiam cumque eius architecto incidunt non.</div>
    <div class="div2">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Non, dolorum!</div>
</body>
</html>
