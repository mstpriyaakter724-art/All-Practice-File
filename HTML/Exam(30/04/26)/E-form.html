<br><br><br>


    <form action="">

        <label for="name">Name</label>
        : <input type="text" name="" id="name"><br><br>
        <label for="email">Email</label>
        : <input type="email" name="" id="email"><br><br>
        <label for="pass">Password</label>
        : <input type="password" name="" id="pass"><br><br>
        <label for="gender">Gender :</label>
        <input type="radio" name="gender" id="male">
        <label for="male"> Male</label>
            
        <input type="radio" name="gender" id="female">
        <label for="female">female </label>
            
       <br><br>
        <label for="skill">Skills :</label><br>
        <input type="checkbox" name="" id="skill">
        <label for="html">HTML </label>

        <input type="checkbox" name="" id="css">
        <label for="css">CS </label>
        <input type="checkbox" name="" id="js">
        <label for="js">JS</label><br><br>
        <label for="country">Country :</label>
        <select name="" id="country">
            <option value="Bangladesh">Bangladesh</option>
            <option value="USA">USA</option>
            <option value="UK">UK</option>
        </select>
        <br><br>
        <label for="dob">Date of Birth :</label>
        <input type="date" name="" id="dob"><br><br>
        <label for="file">Upload File</label>
        <input type="file" name="" id="file"><br><br>
        <label for="msg">Message :</label><br>
        <textarea name="" id="msg"></textarea><br><br>
        <button>Submit</button>













    </form>
</body>
