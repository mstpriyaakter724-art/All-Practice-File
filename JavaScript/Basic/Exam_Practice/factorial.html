<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Numbetr</title>
</head>
<body>


    <script>
        let num = Number(prompt( "Enter a number."));
        let result = 1;
        for ( let i = 1; i <= num; i++){
            result*= i;
             console.log(` ${result / i} x ${i} = ${result}`);
        }
       
       console.log(result);
       document.write(`<p> ${result} </p>`)
       
    </script>
</body>
</html>
