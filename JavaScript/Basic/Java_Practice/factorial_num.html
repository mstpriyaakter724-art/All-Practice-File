<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Number</title>
</head>
<body>
  <script>
    function factorial(fnum){
       
        let result = 1;
        for (let i=1; i<= fnum; i++){
            result *= i;
        }
       document.write( `<h2> The factorial number of ${fnum} is ${result}. </h2>`);
    }
    
    factorial(Number(prompt( "Enter a number")))
  </script>  
</body>
</html>
