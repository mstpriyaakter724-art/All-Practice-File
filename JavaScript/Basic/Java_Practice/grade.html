<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>result Grade</title>
</head>
<body>
    <label for="num">Enter a number</label>
    <input type="text" id="num">
    <button onclick="sbtn()">Submit</button>
    <h3 id="result"></h3>
    <script>
        function sbtn(){
            let input_num =Number (document.querySelector("#num").value);
            let result = "";
            if(input_num > 100){
                result = "Invalid Number"; 
                            
            }else if (input_num >= 80){
                result = `You got an A+`;
            }else if (input_num >= 70){

                result = " You got an A";
            }else if (input_num >= 60){
                result = " You got an A-"
            }else{
                result = " You failed";
            }
            document.querySelector("#result").innerText=(`${result}`)
          
        }
        
    </script>

</body>
</html>
