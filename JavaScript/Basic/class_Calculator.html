        class Calculator{
            constructor(a_value, b_value){
                this.a = a_value;
                this.b = b_value;
            }
            add(){
                return this.a + this.b;
            }
            sub(){
                return this.a - this.b;
            }
            mul(){
                return this.a * this.b;
            }
           static div(a,b){
                return a / b;
            }
        }
        let cal = new Calculator(100,2);
        console.log(cal.add());
        console.log(cal.sub());
        console.log(cal.mul());
        
        
        
       console.log(Calculator.div(90,2));

//**************Polymorphism***********************
class Pet extends Animal {
constructor(name,avarageAge, habitat, isVaccenied,owner_name){
    super(name,avarageAge, habitat)
    this.isVaccenied = isVaccenied;
    this.owner_name = owner_name;
    }

    //************Polymorphism overriding parents method*****************
    speak(){
        return `${this.name} barks in evening.`;
    }
    walk(){
        return `${this.name} walks in park`
    }



// ********* Encapsulation*************
setName(name){
    this.name = name;
}
getName(){
    return this.name;
}
//***************************************


}
