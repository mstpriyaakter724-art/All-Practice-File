<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Number</title>
</head>
<body>
    
    <label for="num"></label>
    <input type="number" name="" id="num"><br><br>

   <button id="btn" onclick="sbtn()">Submit</button>
    <h3 id="result"></h3>

    <script>
       function sbtn(){
        let num =Number (document.getElementById("num").value);
        let result = 1;
        for( let i=1; i<= num; i++ ){
            result *= i;

        }
        document.querySelector("#result").innerText= `The factorial number of ${num} is ${result}.`;
       }

       

    </script>








</body>
</html>
