<!DOCTYPE html>
<html>
<head>
    <title>Find Largest Number</title>
</head>
<body>

    <h2></h2>

    <form id="form_id">
        A: <input type="number" id="a"><br><br>
        B: <input type="number" id="b"><br><br>
        C: <input type="number" id="c"><br><br>

        <button type="submit">Result</button>
    </form>

    <h3 id="output"></h3>

    <script>
        document.getElementById("form_id").onsubmit = function(e) {
            e.preventDefault();

            let a = Number(document.getElementById("a").value);
            let b = Number(document.getElementById("b").value);
            let c = Number(document.getElementById("c").value);

            let largest;

            if (a >= b && a >= c) {
                largest = a;
            } else if (b >= a && b >= c) {
                largest = b;
            } else {
                largest = c;
            }

            document.getElementById("output").innerText = `The largest number ${largest}` ;
        }
    </script>

</body>
</html>
