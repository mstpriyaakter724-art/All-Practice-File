<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <label for="num1">Enter 1st number:</label>
    <input type="number" name="" id="num1"><br><br>
    <label for="num2">Enter 2nd number:</label>
    <input type="number" name="" id="num2"><br><br>
    <label for="num3">Enter 3rd number:</label>
    <input type="number" name="" id="num3"><br>
    <button onclick="sbtn()">Submit</button>
    <h3 id="result"></h3>


    <script>
        function sbtn() {
            let num1 =Number (document.getElementById("num1").value);
            let num2 =Number (document.getElementById("num2").value);
            let num3 =Number( document.getElementById("num3").value);
            let result = "";
            
            if(num1 > num2){
                if(num1 > num3){
                    result = `${num1} is maximun number among ${num1}, ${num2} & ${num3}. `
                }else{
                  result = `${num3} is maximun number among ${num1}, ${num2} & ${num3}. `  
                }
            }else if (num2 > num1){
                if(num2 > num3){
                  result = `${num2} is maximun number among ${num1}, ${num2} & ${num3}. `  
                }else
                result = `${num3} is maximun number among ${num1}, ${num2} & ${num3}. `
            }else{
                result = `${num3} is maximun number among ${num1}, ${num2} & ${num3}. `
            }


document.querySelector("#result").innerText= `${result}`
        }


    </script>
</body>

</html>
