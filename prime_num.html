<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prime Number</title>
</head>

<body>
    <script>
        function isPrime(number) {
            if (number <= 1) {
                document.write(` <h2> ${number} is not a prime number.</h2>`)
                return;
            }

            for (let i = 2; i < number; i++) {

                if (number % i == 0) {
                   document.write(` <h2> ${number} is not a prime number.</h2>`)
                return;
            }
            document.write(` <h2> ${number} is  a prime number.</h2>`)
                return;

            }
        }

        isPrime(Number(prompt("Enter a number")));
        
        

        
    </script>

</body>

</html>
